const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault(); const msg = document.getElementById('msg'); msg.textContent = 'Checking…';
  try {
    if (!window.crypto || !crypto.subtle) throw new Error('This browser cannot decrypt here. Open the page over https.');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(PAYLOAD.salt), iterations: PAYLOAD.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    let html;
    try { html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(PAYLOAD.iv) }, key, b64(PAYLOAD.data))); }
    catch (err) { msg.textContent = 'Wrong password.'; return; }
    document.open(); document.write(html); document.close();
  } catch (err) { msg.textContent = err.message; }
});
